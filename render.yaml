services:
  - type: web
    name: kmt-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
     - key: PYTHON_VERSION
        value: 3.13.0
      - key: BOT_TOKEN
        sync: false
      - key: GAS_URL
        sync: false
      - key: DEMO
        value: "0"
      - key: WEBAPP_URL
        value: https://newkmtapp.onrender.com
